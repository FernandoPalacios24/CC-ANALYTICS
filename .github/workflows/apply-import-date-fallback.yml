name: Apply import date fallback

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-import-date-fallback.mjs
      - .github/workflows/apply-import-date-fallback.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: node scripts/fix-import-date-fallback.mjs
      - name: Remove temporary patch files
        run: |
          rm -f scripts/fix-import-date-fallback.mjs
          rm -f .github/workflows/apply-import-date-fallback.yml
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corregir importación cuando las fechas del archivo no coinciden con el rango"
          git push origin main
