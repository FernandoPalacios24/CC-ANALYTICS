    () => selectedSellers.filter((seller) => isSellerActiveOnDate(seller, announcedDate)),
    [announcedDate, selectedSellers],
  );
  const importPeriodSellers = useMemo(
    () => selectedSellers.filter((seller) =>
      seller.hire_date <= importEnd &&
      (!seller.inactive_effective_date || seller.inactive_effective_date >= importStart),
    ),
    [importEnd, importStart, selectedSellers],
  );
  const reportSellers = useMemo(
    () => selectedSellers.filter((seller) => isSellerActiveInMonth(seller, reportMonth)),
    [reportMonth, selectedSellers],
  );
'''
