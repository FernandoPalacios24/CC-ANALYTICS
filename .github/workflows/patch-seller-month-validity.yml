name: Patch seller month validity

on:
  push:
    branches:
      - fix/seller-month-validity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seller-month-validity
