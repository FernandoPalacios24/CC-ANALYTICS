  return (
    seller.effective_status === "activo" ||
    (seller.effective_status === "salida_pendiente" &&
      (!seller.inactive_effective_date ||
        seller.inactive_effective_date > today()))
  );
}
'''
          new = '''function isSellerActiveOnDate(seller: SellerRecord, date: string) {
  const cleanDate = date.slice(0, 10);
  if (!cleanDate || seller.hire_date > cleanDate) return false;
  return !seller.inactive_effective_date || seller.inactive_effective_date > cleanDate;
}

function isSellerActiveInMonth(seller: SellerRecord, month: string) {
  const { start, end } = monthBounds(month);
  return seller.hire_date < end &&
    (!seller.inactive_effective_date || seller.inactive_effective_date >= start);
}

function isSellerAvailable(seller: SellerRecord) {
  return isSellerActiveOnDate(seller, today());
}
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  const activeSellers = useMemo(
    () => selectedSellers.filter(isSellerAvailable),
    [selectedSellers],
  );
'''
